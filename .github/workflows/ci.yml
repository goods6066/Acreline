name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Pinned like the actions: `ubuntu-latest` moves to a new image on GitHub's
    # schedule, which changes the preinstalled toolchain without a commit here.
    # To move it, bump this label deliberately.
    runs-on: ubuntu-26.04
    steps:
      # Actions are pinned to full commit SHAs so a retagged release cannot
      # change what CI runs; the trailing comment records the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Frozen lockfile: fails if bun.lock and package.json disagree, so CI
      # installs exactly the versions the site was built with.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
